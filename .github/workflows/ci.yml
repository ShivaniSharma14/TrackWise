
name: TrackWise CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-test-secret-key-that-is-at-least-32-bytes
      DEBUG: "True"
      USE_SQLITE: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django tests with coverage
        run: |
          coverage erase
          coverage run --source=accounts,habits,expenses,config manage.py test
          coverage report

  frontend-checks:
    name: Frontend Typecheck and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

  browser-tests:
    name: Playwright Browser Tests
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key-that-is-at-least-32-bytes
      DEBUG: "True"
      USE_SQLITE: "True"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Start Django backend
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8000 > /tmp/backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/admin/login/ > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1

      - name: Start Vite frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/frontend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/frontend.log
          exit 1

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: warn